name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned toolchain
        run: npm ci

      - name: Test grammar, snippets and workflows
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX
        run: npm run verify:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: siyo-vsix
          path: siyo-*.vsix
          if-no-files-found: error
